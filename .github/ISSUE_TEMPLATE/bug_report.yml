name: Bug report
description: Something on the TV does not work or looks wrong.
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: TV or box model
      description: "adb shell getprop ro.product.model"
      placeholder: Xiaomi TV Box S 3rd gen (MiTV-AFMU0)
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: "adb shell getprop ro.build.version.release"
      placeholder: "14"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Luxury TV version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Add a screenshot if it is about the screen.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please leave out anything private, such as Wi-Fi names, accounts or your list of installed apps.
